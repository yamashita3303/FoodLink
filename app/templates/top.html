<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選択画面</title>
<style>
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #fff;
    margin: 0;
  }
 
  .icon {
    width: 80px;
    height: 80px;
    border: 1.5px solid #555;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
    font-size: 14px;
    color: #333;
  }
 
  .button {
    width: 200px;
    padding: 12px 0;
    margin: 10px 0;
    border: 1.5px solid #555;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    background-color: #fff;
    transition: transform 0.1s;
  }
 
  /* スーパー：青の影 */
  .super {
    box-shadow: 5px 5px 0px #b7e4e4;
  }
 
  /* 一般利用者：黄色の影 */
  .user {
    box-shadow: 5px 5px 0px #ffd966;
  }
 
  /* 押したとき（影も一体で下がる） */
  .button:active {
    transform: translate(2px, 2px);
    box-shadow: 3px 3px 0px rgba(0,0,0,0);
  }
 
</style>
</head>
<body>
 
  <div class="icon">アイコン</div>
 
  <div class="button super">スーパー</div>
  <div class="button user">一般利用者</div>
 
</body>
</html>
