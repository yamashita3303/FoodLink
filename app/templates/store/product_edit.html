{% extends "store/base.html" %}

{% block content %}
<style>
  .edit-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
  }

  .edit-container h3 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: bold;
  }

  .edit-container form p {
    margin-bottom: 15px;
  }

  .edit-container label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }

  .edit-container input,
  .edit-container select,
  .edit-container textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .image-upload {
    margin-top: 20px;
  }

  .image-upload input {
    padding: 6px;
  }

  .button-group {
    display: flex;
    gap: 12px;
    margin-top: 30px;
  }

  .btn-submit {
    flex: 1;
    background-color: #198754;
    color: #fff;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-submit:hover {
    opacity: 0.9;
  }

  .btn-back {
    flex: 1;
    text-align: center;
    background-color: #f1f1f1;
    color: #333;
    padding: 12px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
  }

  .btn-back:hover {
    background-color: #e0e0e0;
  }
</style>

<div class="edit-container">
  <h3>商品編集</h3>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <div class="button-group">
      <button type="submit" class="btn-submit">更新する</button>
      <a href="{% url 'store_home' %}" class="btn-back">戻る</a>
    </div>
  </form>
</div>
{% endblock %}
