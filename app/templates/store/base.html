{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Store{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #fff;
      margin: 0;
      padding-bottom: 70px; /* 下の固定ナビ分 */
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* ===== 下部固定ナビ ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #e9f4f7;
      border-top: 1px solid #ccc;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 65px;
      z-index: 1000;
    }

    .bottom-nav a {
      color: #000;
      text-decoration: none;
      text-align: center;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    .bottom-nav a i {
      font-size: 22px;
    }

    .bottom-nav a.active {
      color: #46569b;
      transform: scale(1.1);
    }

    /* ===== メインコンテンツ ===== */
    main {
      padding: 15px;
      margin-bottom: 80px;
    }

    /* ===== スマホ対応 ===== */
    @media (max-width: 768px) {
      .bottom-nav {
        height: 60px;
      }
      .bottom-nav a i {
        font-size: 20px;
      }
      .bottom-nav a span {
        font-size: 10px;
      }
      main {
        padding: 10px;
      }
    }

    a, button {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <!-- メインコンテンツ -->
  <main>
    {% block content %}
    {% endblock %}
  </main>

  <!-- 下部固定ナビ -->
  <nav class="bottom-nav">
    <a href="{% url 'store_home' %}" class="{% if 'store_home' in request.path %}active{% endif %}">
      <i class="bi bi-house-fill"></i>
      <span>ホーム</span>
    </a>

    <!-- ★ 準備開始（旧：出品一覧） -->
    <a href="{% url 'store_list' %}"
      class="position-relative d-inline-flex align-items-center
              {% if 'list' in request.path %}active{% endif %}">

      <i class="bi bi-box-seam fs-5"></i>
      <span>準備開始</span>
      
      {% if order_notification_count > 0 %}
        <span class="position-absolute top-0 start-100 translate-middle
                    badge rounded-pill bg-danger notification-badge">
          {{ order_notification_count }}
        </span>
      {% endif %}
    </a>


    <a href="{% url 'store_alert' %}"
      class="position-relative d-inline-flex align-items-center
              {% if 'store_alert' in request.path %}active{% endif %}">

      <i class="bi bi-bell fs-5"></i>
      <span>通知</span>

      {% if other_notification_count > 0 %}
        <span class="position-absolute top-0 start-100 translate-middle
                    badge rounded-pill bg-danger notification-badge">
          {{ other_notification_count }}
        </span>
      {% endif %}
    </a>
    
    <a href="{% url 'store_mypage' %}" class="{% if 'store_mypage' in request.path %}active{% endif %}">
      <i class="bi bi-person-fill"></i>
      <span>マイページ</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
