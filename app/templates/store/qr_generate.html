<!-- store/qr_generate.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ロッカーQRコード生成</title>
    <style>
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .qr-box {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .qr-box img {
            width: 100%;
            height: auto;
            max-width: 180px;   /* ← QRの最大サイズ */
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<h1>ロッカーQRコード生成</h1>

<form method="post">
    {% csrf_token %}
    <label>ロッカー番号（開始）</label><br>
    <input type="number" name="start_locker" required><br><br>

    <label>ロッカー番号（終了）</label><br>
    <input type="number" name="end_locker" required><br><br>

    <button type="submit">QRコード生成</button>
</form>

{% if qr_list %}
    <hr>
    <h2>生成されたQRコード</h2>

    <div class="qr-grid">
        {% for qr in qr_list %}
            <div class="qr-box">
                <p>ロッカー {{ qr.locker }}</p>
                <img src="{{ qr.image }}">
            </div>
        {% endfor %}
    </div>
{% endif %}

</body>
</html>
