{% extends "store/base.html" %}
{% load static %}

{% block title %}商品登録 | FoodLink{% endblock %}

{% block content %}
<style>
  .form-container {
    max-width: 420px;
    margin: 30px auto;
    padding: 30px;
    background-color: #fff;
  }

  .upload-btn {
    display: block;
    background-color: #f6f6f6;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 12px 0;
    cursor: pointer;
    margin: 0 auto 20px;
    color: #333;
    font-size: 15px;
    text-align: center;
    width: 100%;
    max-width: 360px;
    transition: all 0.2s ease;
  }

  .upload-btn:hover {
    background-color: #f0f0f0;
    border-color: #999;
  }

  input[type="file"] {
    display: none;
  }

  .preview-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .preview-item {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #ccc;
  }

  .preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background-color: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }

  label {
    font-size: 14px;
    color: #333;
    display: block;
    margin-bottom: 4px;
  }

  .form-control {
    border: 2px solid #ccc;
    border-radius: 12px;
    padding: 10px;
    width: 100%;
    box-sizing: border-box;
    font-size: 16px;
    margin-bottom: 15px;
    background-color: #fff;
  }

  select.form-control {
    background-image: url("data:image/svg+xml;utf8,<svg fill='%23666' height='18' viewBox='0 0 24 24' width='18' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px 16px;
  }

  .form-control:focus,
  select.form-control:focus {
    border-color: #f7c600;
    outline: none;
  }

  .form-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .form-row .form-control {
    flex: 1;
  }

  .submit-btn {
    width: 100%;
    background-color: #BAE8E8;
    border: none;
    border-radius: 30px;
    padding: 12px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
  }

  .submit-btn:hover {
    background-color: #a9dcdc;
  }

  textarea {
    resize: none;
  }
</style>

<div class="form-container">
  <form id="product-form" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label for="id_image" class="upload-btn">
      📷 写真アップロード
    </label>
    <input type="file" id="id_image" name="images" accept="image/*" multiple>

    <div class="preview-container" id="preview"></div>

    <!-- 商品名 -->
    <label for="{{ form.name.id_for_label }}">商品名</label>
    {{ form.name }}

    <div class="form-row">
      <div style="flex: 1;">
        <label for="{{ form.price.id_for_label }}">価格(円)</label>
        {{ form.price }}
      </div>
      <div style="flex: 1;">
        <label for="{{ form.expiration_date.id_for_label }}">消費期限</label>
        {{ form.expiration_date }}
      </div>
    </div>

    <div class="form-row">
      <div style="flex: 1;">
        <label for="{{ form.quantity.id_for_label }}">数量</label>
        {{ form.quantity }}
      </div>
      <div style="flex: 1;">
        <label for="{{ form.category.id_for_label }}">カテゴリー</label>
        {{ form.category }}
      </div>
    </div>
    
    <label for="{{ form.origin.id_for_label }}">産地</label>
    {{ form.origin }}

    <label for="{{ form.notes.id_for_label }}">備考</label>
    {{ form.notes }}

    <button type="submit" class="submit-btn">登録</button>
  </form>
</div>

<a href="javascript:history.back()" 
   style="position: fixed; top: 15px; left: 15px; color: #000; font-size: 24px; text-decoration: none; z-index: 1200;">
   <i class="bi bi-arrow-left"></i>
</a>

<script>
  const fileInput = document.getElementById('id_image');
  const previewContainer = document.getElementById('preview');
  const form = document.getElementById('product-form');
  let filesArray = [];

  fileInput.addEventListener('change', (event) => {
    const newFiles = Array.from(event.target.files);
    if (filesArray.length + newFiles.length > 5) {
      alert('アップロードできるのは最大5枚までです。');
      return;
    }
    newFiles.forEach((file) => {
      filesArray.push(file);
      const reader = new FileReader();
      reader.onload = (e) => {
        const item = document.createElement('div');
        item.classList.add('preview-item');
        item.innerHTML = `
          <img src="${e.target.result}" alt="preview">
          <button type="button" class="remove-btn">&times;</button>
        `;
        previewContainer.appendChild(item);

        item.querySelector('.remove-btn').addEventListener('click', () => {
          const index = Array.from(previewContainer.children).indexOf(item);
          filesArray.splice(index, 1);
          item.remove();
          updateFileInput();
        });
      };
      reader.readAsDataURL(file);
    });
    updateFileInput();
  });

  function updateFileInput() {
    const dataTransfer = new DataTransfer();
    filesArray.forEach((f) => dataTransfer.items.add(f));
    fileInput.files = dataTransfer.files;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(form);

    fetch("", {
      method: "POST",
      body: formData,
    })
    .then(response => {
      if (response.ok) {
        alert("商品を登録しました！");
        form.reset();
        previewContainer.innerHTML = "";
        filesArray = [];
      } else {
        alert("登録に失敗しました。");
      }
    })
    .catch(() => alert("通信エラーが発生しました。"));

    
  });
</script>
{% endblock %}
