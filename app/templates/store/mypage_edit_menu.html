{% extends "store/base.html" %}
{% block title %}編集メニュー | FoodLink{% endblock %}

{% block content %}

<!-- Font Awesome（アイコン用） -->
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ===== スクロール禁止（レイアウト非破壊） ===== */
html, body {
    height: 100%;
    overflow: hidden;
}

/* ===== レイアウト ===== */
.edit-wrapper {
    max-width: 420px;
    margin: 20px auto;
    padding: 0 12px;
}

.edit-wrapper h2 {
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: 600;
}

/* ===== メニュー ===== */
.edit-menu {
    list-style: none;
    padding: 0;
    margin: 0;
}

.edit-menu li a {
    display: flex;
    align-items: center;
    gap: 14px;          /* 少し広く */
    padding: 18px 12px; /* 高さアップ */
    font-size: 18px;    /* ← 16 → 18 */
    color: #222;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
    min-height: 56px;   /* タップしやすさUP */
}


.edit-menu li a:hover {
    background-color: #fafafa;
}

.edit-menu i {
    width: 20px;
    text-align: center;
    color: #555;
}

/* ===== 戻る ===== */
.edit-menu li.logout a {
    color: #d32f2f;
}

.edit-menu li.logout i {
    color: #d32f2f;
}
</style>

<div class="edit-wrapper">
    <h2>マイページ</h2>

    <ul class="edit-menu">
        <li>
            <a href="{% url 'store_edit_username' %}">
                <i class="fa-solid fa-user"></i>
                ユーザネーム変更
            </a>
        </li>
        <li>
            <a href="{% url 'store_edit_phone' %}">
                <i class="fa-solid fa-phone"></i>
                電話番号変更
            </a>
        </li>
        <li>
            <a href="{% url 'store_edit_password' %}">
                <i class="fa-solid fa-lock"></i>
                パスワード変更
            </a>
        </li>
        <li>
            <a href="{% url 'store_edit_address' %}">
                <i class="fa-solid fa-location-dot"></i>
                住所変更
            </a>
        </li>
        <li>
            <a href="{% url 'store_edit_hours' %}">
                <i class="fa-solid fa-clock"></i>
                営業時間変更
            </a>
        </li>
        <li class="logout">
            <a href="{% url 'store_mypage' %}">
                <i class="fa-solid fa-right-from-bracket"></i>
                戻る
            </a>
        </li>
    </ul>
</div>

{% endblock %}
