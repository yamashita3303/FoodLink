<form method="post" action="https://pt01.mul-pay.jp/payment/ExecTran.idPass">
    {% csrf_token %}

    <!-- 必須パラメータ -->
    <input type="hidden" name="ShopID" value="{{ ShopID }}">
    <input type="hidden" name="AccessID" value="{{ AccessID }}">
    <input type="hidden" name="AccessPass" value="{{ AccessPass }}">
    <input type="hidden" name="OrderID" value="{{ OrderID }}">
    <input type="hidden" name="JobCd" value="CAPTURE">
    <input type="hidden" name="Amount" value="{{ Amount }}">
    <input type="hidden" name="RetURL" value="{{ RetURL }}">

    <label>カード番号</label><br>
    <input type="text" name="CardNo" placeholder="4111111111111111" required><br><br>

    <label>有効期限（YYMM）</label><br>
    <input type="text" name="Expire" placeholder="2605" required><br><br>

    <label>セキュリティコード</label><br>
    <input type="text" name="SecurityCode" placeholder="123" required><br><br>

    <label>支払方法</label><br>
    <select name="Method" required>
        <option value="1">一括払い</option>
        <option value="2">分割</option>
        <option value="3">ボーナス一括</option>
    </select><br><br>

    <button type="submit">決済する</button>
</form>
